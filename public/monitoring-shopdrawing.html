<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Shopdrawing — Proyek Pejaten</title>
  <script src="shopdrawing_monitoring_data.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel2: #172033;
      --line: #243247;
      --text: #e5edf7;
      --muted: #9aa8bc;
      --green: #22c55e;
      --green-bg: rgba(34,197,94,.12);
      --blue: #38bdf8;
      --blue-bg: rgba(56,189,248,.12);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245,158,11,.12);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,.12);
      --gray: #64748b;
      --gray-bg: rgba(100,116,139,.10);
      --orange: #fb923c;
      --orange-bg: rgba(251,146,60,.12);
      --violet: #a78bfa;
      --violet-bg: rgba(167,139,250,.12);
      --body-bg: linear-gradient(180deg, #08101d, #0b1220 30%, #0b1220 100%);
    }
    body.day-mode {
      --bg: #eef4fb;
      --panel: #ffffff;
      --panel2: #f8fbff;
      --line: #d8e4f2;
      --text: #0f172a;
      --muted: #4b5563;
      --gray: #94a3b8;
      --green-bg: rgba(22,163,74,.08);
      --blue-bg: rgba(14,165,233,.08);
      --yellow-bg: rgba(234,179,8,.10);
      --red-bg: rgba(239,68,68,.08);
      --orange-bg: rgba(249,115,22,.08);
      --violet-bg: rgba(139,92,246,.08);
      --gray-bg: rgba(148,163,184,.08);
      --body-bg: linear-gradient(180deg, #f7fbff, #eef4fb 38%, #e9f1fa 100%);
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--body-bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .25s ease, color .25s ease;
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 24px 48px; }

    /* Header */
    .head {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
      justify-content: space-between; margin-bottom: 24px;
    }
    .head-left h1 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
    .head-left .sub { color: var(--muted); font-size: 13px; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .head-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .badge-link {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: 999px; background: rgba(56,189,248,.10); border: 1px solid rgba(56,189,248,.24);
      color: #bae6fd; font-size: 12px; font-weight: 600; text-decoration: none;
      transition: background .2s, border-color .2s;
    }
    .badge-link:hover { background: rgba(56,189,248,.18); border-color: rgba(56,189,248,.42); }
    body.day-mode .badge-link { color: #0369a1; background: rgba(14,165,233,.08); border-color: rgba(14,165,233,.2); }
    .theme-btn {
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 999px; padding: 9px 16px; cursor: pointer; font-size: 13px; font-weight: 600;
      transition: background .2s;
    }
    .theme-btn:hover { background: var(--panel2); }

    /* Quick stat row */
    .stat-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 20px; transition: border-color .2s;
    }
    .stat-card .stat-num { font-size: 36px; font-weight: 900; line-height: 1; }
    .stat-card .stat-label { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .stat-card.approved .stat-num { color: var(--green); }
    .stat-card.submitted .stat-num { color: var(--blue); }
    .stat-card.revision .stat-num { color: var(--yellow); }
    .stat-card.pending .stat-num { color: var(--gray); }
    .stat-card.total .stat-num { color: var(--text); }
    body.day-mode .stat-card { background: #fff; border-color: #cbd5e1; box-shadow: 0 6px 16px rgba(15,23,42,.06); }

    /* Building cards */
    .section-title {
      font-size: 17px; font-weight: 800; margin-bottom: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    }
    .building-grid {
      display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 32px;
    }
    @media (min-width: 960px) { .building-grid { grid-template-columns: repeat(3, 1fr); } }
    .bld-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      overflow: hidden; transition: border-color .2s;
    }
    body.day-mode .bld-card { background: #fff; border-color: #cbd5e1; box-shadow: 0 6px 18px rgba(15,23,42,.06); }
    .bld-card-header {
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .bld-card-header h3 { font-size: 16px; font-weight: 700; }
    .bld-card-header .bld-summary { font-size: 12px; color: var(--muted); }
    .bld-card-body { padding: 8px 0; max-height: 500px; overflow-y: auto; }
    .shopdrawing-row {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 10px 20px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
      font-size: 13px; transition: background .15s;
    }
    .shopdrawing-row:last-child { border-bottom: none; }
    .shopdrawing-row:hover { background: color-mix(in srgb, var(--panel2) 60%, transparent); }
    .sd-doc-name { font-weight: 600; line-height: 1.35; }
    .sd-meta { color: var(--muted); font-size: 11px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
    .sd-meta span { display: inline-flex; align-items: center; gap: 3px; }
    .sd-status { text-align: right; white-space: nowrap; }

    /* Status badge */
    .status-tag {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
    }
    .status-tag.approved { background: var(--green-bg); color: var(--green); }
    .status-tag.approvedAsNoted { background: var(--blue-bg); color: var(--blue); }
    .status-tag.submitted { background: var(--blue-bg); color: var(--blue); }
    .status-tag.reviewedWithComment { background: var(--yellow-bg); color: var(--yellow); }
    .status-tag.internalReview { background: var(--orange-bg); color: var(--orange); }
    .status-tag.draft { background: var(--violet-bg); color: var(--violet); }
    .status-tag.notStarted { background: var(--gray-bg); color: var(--gray); }
    .status-tag.superseded { background: var(--red-bg); color: var(--red); }

    /* Filters */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
      align-items: center;
    }
    .filter-bar label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .filter-chip {
      border: 1px solid var(--line); background: var(--panel); color: var(--muted);
      border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .18s; user-select: none;
    }
    .filter-chip.active { color: var(--text); border-color: var(--blue); background: rgba(56,189,248,.10); }
    .filter-chip:hover { border-color: var(--blue); }
    body.day-mode .filter-chip { background: #fff; }
    body.day-mode .filter-chip.active { background: rgba(14,165,233,.08); }

    /* Discipline legend */
    .disc-legend {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
    }
    .disc-dot {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
      color: var(--muted); padding: 3px 8px; border-radius: 6px;
      background: color-mix(in srgb, var(--panel) 80%, transparent);
      border: 1px solid var(--line);
    }
    .disc-dot::before {
      content: ''; width: 8px; height: 8px; border-radius: 2px; display: inline-block;
    }
    .disc-dot.d-struktur::before { background: var(--red); }
    .disc-dot.d-arsitektur::before { background: var(--blue); }
    .disc-dot.d-interior::before { background: var(--orange); }
    .disc-dot.d-mep::before { background: var(--green); }
    .disc-dot.d-site::before { background: #a3e635; }
    .disc-dot.d-bim::before { background: var(--violet); }
    .disc-dot.d-temp::before { background: #fbbf24; }
    .disc-dot.d-lain::before { background: var(--gray); }

    /* Rich table view */
    .full-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .full-table thead { position: sticky; top: 0; z-index: 2; }
    .full-table th {
      background: var(--panel2); color: var(--muted); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; text-align: left;
      border-bottom: 2px solid var(--line);
    }
    .full-table td {
      padding: 11px 14px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent);
      font-size: 13px; vertical-align: middle;
    }
    .full-table tbody tr:hover { background: color-mix(in srgb, var(--panel2) 50%, transparent); }
    .full-table .td-doc { font-weight: 600; max-width: 280px; }
    .full-table .td-num { font-family: "SF Mono","Consolas",monospace; font-size: 12px; }
    .full-table .td-date { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .empty-row td { text-align: center; color: var(--muted); padding: 48px 14px; font-size: 14px; }

    /* Table wrapper */
    .table-wrap {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      overflow: hidden; max-height: 70vh; overflow-y: auto;
    }
    body.day-mode .table-wrap { background: #fff; border-color: #cbd5e1; box-shadow: 0 6px 18px rgba(15,23,42,.06); }

    /* Footer */
    .footer-note {
      margin-top: 32px; padding: 16px 20px; border-radius: 14px;
      background: color-mix(in srgb, var(--panel) 60%, transparent);
      border: 1px solid var(--line); font-size: 12px; color: var(--muted);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }

    /* Progress bars */
    .mini-bar { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; margin-top: 6px; }
    .mini-bar-fill { height: 100%; border-radius: inherit; transition: width .35s ease; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  </style>
</head>
<body class="is-loading">
<div class="dashboard-loader">
  <div class="loader-card">
    <div class="loader-mark"></div>
    <div class="loader-title">Memuat Monitoring Shopdrawing</div>
    <div class="loader-sub">Proyek Renovasi Pejaten</div>
    <div class="loader-bar"><span></span></div>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
// ══ Data loaded from shared shopdrawing_monitoring_data.js ══
// window.SHOPDRAWING_MONITORING_DATA is set by the included script.
const D = window.SHOPDRAWING_MONITORING_DATA;
const STATUS_LABEL = D.statusLegend;

// ── Helpers ─────────────────────────────────────────────────────
const DISC_COLORS = {
  'Struktur':'d-struktur','Arsitektur':'d-arsitektur','Interior':'d-interior',
  'MEP':'d-mep','Site Development':'d-site','BIM / Coordination':'d-bim',
  'Temporary Works':'d-temp','Lainnya':'d-lain'
};
const DISC_EMOJI = {
  'Struktur':'🏗️','Arsitektur':'🏛️','Interior':'🛋️','MEP':'⚡',
  'Site Development':'🚧','BIM / Coordination':'🔷','Temporary Works':'🛠️','Lainnya':'📋'
};
const BUILDING_COLORS = { B:'#38bdf8', D:'#f59e0b', K:'#22c55e' };

function fmtDT(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'});
}
function fmtDate(s) { return s || '—'; }
function statusTag(s) { return `<span class="status-tag ${s}">${STATUS_LABEL[s]||s}</span>`; }

let filters = { status:null, discipline:null, building:null };

function applyFilters(items) {
  return items.filter(i => {
    if (filters.status && i.status !== filters.status) return false;
    if (filters.discipline && i.discipline !== filters.discipline) return false;
    if (filters.building && i.buildingCode !== filters.building) return false;
    return true;
  });
}

function setFilter(key, val) {
  filters[key] = filters[key]===val ? null : val;
  render();
}

// ── Render ──────────────────────────────────────────────────────
function render() {
  const allItems = D.buildings.flatMap(b => b.shopdrawings.map(s => ({...s,buildingName:b.buildingName})));
  const filtered = applyFilters(allItems);
  const statuses = ['approved','approvedAsNoted','submitted','reviewedWithComment','internalReview','draft','notStarted'];
  const statusCounts = Object.fromEntries(statuses.map(s=>[s, allItems.filter(i=>i.status===s).length]));

  function miniBar(approved,total) {
    const pct = total ? Math.round(approved/total*100) : 0;
    return `<div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%;background:var(--green)"></div></div>`;
  }

  let html = '';

  // Header
  html += `<div class="head">
    <div class="head-left">
      <h1>📐 Monitoring Shopdrawing</h1>
      <div class="sub">
        <span>${D.projectName}</span>
        <span>·</span>
        <span>Update: ${fmtDT(D.lastUpdated)}</span>
      </div>
    </div>
    <div class="head-right">
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ Mode Terang</button>
    </div>
  </div>`;

  // Stat row
  html += `<div class="stat-row">
    <div class="stat-card total"><div class="stat-num">${D.summary.total}</div><div class="stat-label">Total Dokumen</div></div>
    <div class="stat-card approved"><div class="stat-num">${statusCounts.approved}</div><div class="stat-label">✅ Approved</div></div>
    <div class="stat-card submitted"><div class="stat-num">${statusCounts.submitted}</div><div class="stat-label">📤 Submitted</div></div>
    <div class="stat-card revision"><div class="stat-num">${statusCounts.reviewedWithComment}</div><div class="stat-label">🔄 Perlu Revisi</div></div>
    <div class="stat-card pending"><div class="stat-num">${statusCounts.notStarted + statusCounts.draft}</div><div class="stat-label">⏳ Belum Diajukan</div></div>
  </div>`;

  // Filters
  html += `<div class="filter-bar">
    <label>Status:</label>
    <span class="filter-chip${!filters.status?' active':''}" onclick="setFilter('status',null)">Semua</span>
    ${statuses.map(s=>`<span class="filter-chip${filters.status===s?' active':''}" onclick="setFilter('status','${s}')">${STATUS_LABEL[s]}</span>`).join('')}
  </div>`;
  html += `<div class="filter-bar">
    <label>Gedung:</label>
    <span class="filter-chip${!filters.building?' active':''}" onclick="setFilter('building',null)">Semua</span>
    ${D.buildings.map(b=>`<span class="filter-chip${filters.building===b.buildingCode?' active':''}" onclick="setFilter('building','${b.buildingCode}')">${b.buildingName}</span>`).join('')}
  </div>`;
  html += `<div class="filter-bar">
    <label>Disiplin:</label>
    <span class="filter-chip${!filters.discipline?' active':''}" onclick="setFilter('discipline',null)">Semua</span>
    ${D.disciplines.filter(d=>allItems.some(i=>i.discipline===d)).map(d=>`<span class="filter-chip${filters.discipline===d?' active':''}" onclick="setFilter('discipline','${d}')">${DISC_EMOJI[d]||''} ${d}</span>`).join('')}
  </div>`;

  // Discipline legend
  html += `<div class="disc-legend">
    ${D.disciplines.filter(d=>allItems.some(i=>i.discipline===d)).map(d=>`<span class="disc-dot ${DISC_COLORS[d]||'d-lain'}">${d}</span>`).join('')}
  </div>`;

  // Building cards
  html += `<div class="section-title"><span class="dot" style="background:var(--blue)"></span> Per Gedung</div>`;
  html += `<div class="building-grid">`;

  for (const b of D.buildings) {
    const bItems = applyFilters(b.shopdrawings.map(s=>({...s,buildingName:b.buildingName})));
    html += `<div class="bld-card">
      <div class="bld-card-header">
        <div>
          <h3>${DISC_EMOJI['Struktur']} ${b.buildingName}</h3>
          <div class="bld-summary">${bItems.length} item — Approved ${b.summary.approved}/${b.summary.total}</div>
          ${miniBar(b.summary.approved,b.summary.total)}
        </div>
      </div>
      <div class="bld-card-body">`;
    if (bItems.length === 0) {
      html += `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Tidak ada item yang cocok filter</div>`;
    } else {
      for (const s of bItems) {
        html += `<div class="shopdrawing-row">
          <div>
            <div class="sd-doc-name">${s.documentName}</div>
            <div class="sd-meta">
              <span>${DISC_EMOJI[s.discipline]||''} ${s.discipline}</span>
              <span>·</span>
              <span>${s.workPackage}</span>
              ${s.documentNumber ? `<span>·</span><span style="font-family:monospace;font-size:11px">${s.documentNumber}</span>` : ''}
              ${s.approvalDate ? `<span>·</span><span>✔ ${fmtDate(s.approvalDate)}</span>` : ''}
            </div>
          </div>
          <div class="sd-status">${statusTag(s.status)}</div>
        </div>`;
      }
    }
    html += `</div></div>`;
  }
  html += `</div>`;

  // Full table
  html += `<div class="section-title" style="margin-top:8px"><span class="dot" style="background:var(--green)"></span> Tabel Lengkap (${filtered.length} item)</div>`;
  html += `<div class="table-wrap"><table class="full-table">
    <thead><tr>
      <th>ID</th><th>Gedung</th><th>Nama Dokumen</th><th>Disiplin</th><th>Work Package</th><th>No. Dokumen</th><th>DED Ref</th><th>Status</th><th>Tgl Submit</th><th>Tgl Approval</th><th>Reviewer</th>
    </tr></thead>
    <tbody>`;
  if (filtered.length === 0) {
    html += `<tr class="empty-row"><td colspan="11">🔍 Tidak ada data yang cocok dengan filter aktif</td></tr>`;
  } else {
    for (const s of filtered) {
      html += `<tr>
        <td class="td-num">${s.id}</td>
        <td>${s.buildingName}</td>
        <td class="td-doc">${s.documentName}</td>
        <td><span class="disc-dot ${DISC_COLORS[s.discipline]||'d-lain'}">${s.discipline}</span></td>
        <td>${s.workPackage}</td>
        <td class="td-num">${s.documentNumber||'—'}</td>
        <td class="td-num">${s.dedDocumentNumber||'—'}</td>
        <td>${statusTag(s.status)}</td>
        <td class="td-date">${fmtDate(s.actualSubmitDate)}</td>
        <td class="td-date">${fmtDate(s.approvalDate)}</td>
        <td>${s.reviewer||'—'}</td>
      </tr>`;
    }
  }
  html += `</tbody></table></div>`;

  // Footer
  html += `<div class="footer-note">
    <span>🔗 Sumber: <a href="${D.sourceWorkbook}" target="_blank" style="color:var(--blue)">Google Sheets Monitoring</a></span>
    <span>Data diperbarui otomatis dari workbook monitoring shopdrawing</span>
    <span>${D.buildings.map(b=>`${b.buildingName}: ${b.summary.approved}/${b.summary.total} approved`).join(' · ')}</span>
  </div>`;

  document.getElementById('app').innerHTML = html;
}

// ── Theme ───────────────────────────────────────────────────────
function toggleTheme() {
  const b = document.body;
  const btn = document.getElementById('themeBtn');
  if (b.classList.contains('day-mode')) {
    b.classList.remove('day-mode');
    btn.innerHTML = '☀️ Mode Terang';
    localStorage.setItem('mon-shopdrawing-theme','dark');
  } else {
    b.classList.add('day-mode');
    btn.innerHTML = '🌙 Mode Gelap';
    localStorage.setItem('mon-shopdrawing-theme','light');
  }
}

// ── Init ────────────────────────────────────────────────────────
(function init() {
  const saved = localStorage.getItem('mon-shopdrawing-theme');
  if (saved === 'light') document.body.classList.add('day-mode');
  render();
  document.body.classList.remove('is-loading');
})();
</script>
</body>
</html>
