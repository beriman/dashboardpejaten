<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D IFC Viewer - Renovasi Pejaten</title>
  <style>
    :root { color-scheme: dark; --bg:#08111f; --panel:#101c2f; --line:#253955; --text:#e8f0ff; --muted:#94a3b8; --blue:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
    #app { display:grid; grid-template-rows:auto 1fr; width:100vw; height:100vh; }
    header { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; background:rgba(16,28,47,.94); border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:16px; letter-spacing:.02em; }
    .sub { color:var(--muted); font-size:12px; margin-top:2px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
    button { border:1px solid var(--line); background:#14243a; color:var(--text); border-radius:10px; padding:8px 10px; cursor:pointer; }
    button:hover { border-color:var(--blue); color:white; }
    button.active { background:#0284c7; border-color:#38bdf8; color:white; }
    main { position:relative; min-height:0; }
    #viewer { position:absolute; inset:0; }
    #status { position:absolute; left:16px; bottom:16px; max-width:min(760px, calc(100vw - 32px)); background:rgba(8,17,31,.88); border:1px solid var(--line); border-radius:14px; padding:10px 12px; color:var(--muted); font-size:12px; line-height:1.45; }
    #status strong { color:var(--text); }
    #contextMenu { position: fixed; z-index: 20; display:none; min-width:190px; background:rgba(15,23,42,.98); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 18px 50px rgba(0,0,0,.35); }
    #contextMenu button { display:block; width:100%; text-align:left; border:0; background:transparent; border-radius:8px; padding:9px 10px; }
    #contextMenu button:hover { background:#1e3a5f; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>3D IFC Viewer - <span id="buildingLabel">Gedung</span></h1>
      <div class="sub">Prototype viewer untuk rapat koordinasi. Source: IFC export dari Revit.</div>
    </div>
    <div class="toolbar">
      <button data-discipline="ARS">ARS</button>
      <button data-discipline="STR" class="active">STR</button>
      <button data-discipline="INT">INT</button>
      <button data-discipline="MEP">MEP</button>
      <button id="showAll">All</button>
      <button id="sectionToggle">Section Cut</button>
      <button id="showHidden">Show All Hidden</button>
      <button id="resetView">Reset View</button>
    </div>
  </header>
  <main>
    <div id="viewer"></div>
    <div id="status"><strong>Status:</strong> loading viewer bundle...</div>
  </main>
</div>
<div id="contextMenu">
  <button type="button" data-menu-action="hide">Hide Selected</button>
  <button type="button" data-menu-action="isolate">Isolate Selected</button>
  <button type="button" data-menu-action="show-all">Show All Hidden</button>
</div>
<script>
  window.addEventListener('error', event => {
    const el = document.getElementById('status');
    if (el) el.innerHTML = `<strong>Status:</strong> Error script: ${event.message || 'unknown'} di ${event.filename || ''}:${event.lineno || ''}`;
  });
  window.addEventListener('unhandledrejection', event => {
    const el = document.getElementById('status');
    if (el) el.innerHTML = `<strong>Status:</strong> Error promise: ${event.reason?.message || event.reason || 'unknown'}`;
  });
</script>
<script type="module" src="/assets/ifc-viewer-app.js"></script>
</body>
</html>
